[project]
name = "omnistream-sentinel"
version = "0.1.0"
description = "OmniStream Sentinel - Agentic AI Contact Center Intelligence for Retail Banking"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.36",
    "greenlet>=3.1.1",
    "aiosqlite>=0.20.0",
    "langgraph>=0.2.45",
    "langchain-core>=0.3.15",
    "google-cloud-aiplatform>=1.71.0",
    "google-genai>=0.1.1",
    "sse-starlette>=2.1.3",
    "python-multipart>=0.0.17",
    "httpx>=0.27.2",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

